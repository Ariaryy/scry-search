[workspace]
resolver = "2"
members = [
    "scry-core",
    "scry-fsevents",
    "scry-ipc",
    "scry-daemon",
    "scry-client",
    "scry-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["scry"]
license = "MIT"

[workspace.dependencies]
rkyv = { version = "0.7", features = ["validation"] }
crossbeam = "0.8"
memmap2 = "0.9"
thiserror = "1"
anyhow = "1"
regex-automata = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.daemon-release]
inherits = "release"
opt-level = "s"
panic = "abort"
strip = true
