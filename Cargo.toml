[workspace]
resolver = "2"
members = [
    "scry-core",
    "scry-fsevents",
    "scry-ipc",
    "scry-daemon",
    "scry-client",
    "scry-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["scry"]
license = "MIT"

[workspace.dependencies]
rkyv = { version = "0.7", features = ["validation"] }
crossbeam = "0.8"
memmap2 = "0.9"
thiserror = "1"
anyhow = "1"
regex-automata = "0.4"
arc-swap = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.daemon-release]
inherits = "release"
# opt-level 3, not "s": scryd's hot paths are tight scan loops over the index
# where vectorisation and unrolling matter more than binary size. Size is
# recovered by `strip` and by `panic = "abort"` dropping unwinding tables.
opt-level = 3
lto = "fat"
panic = "abort"
strip = true
