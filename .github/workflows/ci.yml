name: CI

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "Cargo.toml"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "scripts/benchmark-*.py"
      - "scripts/benchmark-*.ps1"
      - "scripts/test-updater*.ps1"
      - "scripts/test-update-discovery.ps1"
      - "scripts/updater/*.ps1"
      - "scripts/tests/**"
      - "assets/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: powershell -NoProfile -File scripts/test-updater.ps1
      - run: powershell -NoProfile -File scripts/test-updater-processes.ps1
      - run: powershell -NoProfile -File scripts/test-updater-helper.ps1
      - run: powershell -NoProfile -File scripts/test-update-discovery.ps1
      - run: python -B -m unittest discover -s scripts/tests -p 'test_benchmark*.py'

