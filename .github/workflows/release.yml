name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile daemon-release -p scry-daemon
      - run: cargo build --release -p scry-cli
      - name: Stage archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/scry -Force | Out-Null
          Copy-Item target/daemon-release/scryd.exe dist/scry/
          Copy-Item target/release/scry.exe dist/scry/
          Copy-Item scripts/install-daemon.ps1,scripts/uninstall-daemon.ps1 dist/scry/
          Copy-Item LICENSE,README.md dist/scry/
          Copy-Item docs/users dist/scry/docs -Recurse
          Compress-Archive -Path dist/scry/* -DestinationPath dist/scry-windows-x86_64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/scry-windows-x86_64.zip
          generate_release_notes: true
